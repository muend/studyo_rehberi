name: Apply verified exam guard
on:
  push:
    paths: ['.github/workflows/apply-exam-guard.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/studyo-atlasi-yukseltme}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          x='  <script src="assets/js/exam-guard.js"></script>\n'
          if 'assets/js/exam-guard.js' not in s: s=s.replace('</body>',x+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserve verified exam content on open" || true
          git rm .github/workflows/apply-exam-guard.yml
          git commit -m "chore: remove one-shot exam guard workflow"
          git push origin HEAD:codex/studyo-atlasi-yukseltme
