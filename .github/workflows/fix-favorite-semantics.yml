name: Fix favorite control semantics
on:
  push:
    branches: [codex/studyo-atlasi-yukseltme]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studyo-atlasi-yukseltme
      - shell: python
        run: |
          from pathlib import Path
          js = Path('assets/js/enhancements.js')
          text = js.read_text()
          text = text.replace("tr.insertBefore(tools,q('.acc-chevron',tr));", "item.insertBefore(tools,q('.acc-body',item));")
          js.write_text(text)
          css = Path('assets/css/enhancements.css')
          style = css.read_text()
          style = style.replace('.item-tools{display:flex;align-items:center;gap:4px;margin-left:4px}', '.item-tools{position:absolute;right:46px;top:9px;z-index:3;display:flex;align-items:center;gap:4px}')
          css.write_text(style)
          Path('.github/workflows/fix-favorite-semantics.yml').unlink(missing_ok=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix favorite control accessibility semantics"
          git push
