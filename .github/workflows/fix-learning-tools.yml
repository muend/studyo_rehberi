name: Fix learning tools
on:
  push:
    branches: [codex/studyo-atlasi-yukseltme]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studyo-atlasi-yukseltme
      - shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/learning-tools.js')
          text=p.read_text()
          text=text.replace("q('.study-score',card).textContent=known.length+' kart öğrenildi'", "q('.study-score').textContent=known.length+' kart öğrenildi'")
          p.write_text(text)
          Path('.github/workflows/fix-learning-tools.yml').unlink(missing_ok=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix quick study initialization"
          git push
