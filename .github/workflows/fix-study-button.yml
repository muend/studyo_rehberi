name: Fix study button
on:
  push:
    branches: [codex/studyo-atlasi-yukseltme]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studyo-atlasi-yukseltme
      - shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/learning-tools.js')
          text=p.read_text().replace("q('#knownCardBtn',card).textContent", "q('#knownCardBtn').textContent")
          p.write_text(text)
          Path('.github/workflows/fix-study-button.yml').unlink(missing_ok=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix quick study button state"
          git push
