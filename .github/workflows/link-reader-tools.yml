name: Link reader tools
on:
  push:
    branches: [codex/studyo-atlasi-yukseltme]
permissions:
  contents: write
jobs:
  link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studyo-atlasi-yukseltme
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          if 'assets/css/readability.css' not in text:
              text=text.replace('<link rel="stylesheet" href="assets/css/enhancements.css">','<link rel="stylesheet" href="assets/css/enhancements.css">\n<link rel="stylesheet" href="assets/css/readability.css">')
          if 'assets/js/learning-tools.js' not in text:
              text=text.replace('<script src="assets/js/enhancements.js" defer></script>','<script src="assets/js/enhancements.js" defer></script>\n<script src="assets/js/learning-tools.js" defer></script>')
          p.write_text(text)
          Path('.github/workflows/link-reader-tools.yml').unlink(missing_ok=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable readability and learning tools"
          git push
