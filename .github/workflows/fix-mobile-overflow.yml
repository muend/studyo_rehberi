name: Fix mobile navigation overflow
on:
  push:
    branches: [codex/studyo-atlasi-yukseltme]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studyo-atlasi-yukseltme
      - shell: python
        run: |
          from pathlib import Path
          css = Path('assets/css/enhancements.css')
          text = css.read_text()
          text += '''
          @media(max-width:900px){
            .topbar{overflow:hidden}
            .topbar-inner{width:100%;min-width:0}
            .logo{width:100%;min-width:0;white-space:normal;padding-right:0;border-right:0}
            .logo-sub{white-space:normal;overflow:hidden;text-overflow:ellipsis}
            .tab-nav{width:100%;min-width:0;overflow-x:auto;overflow-y:hidden}
            .tab-btn{flex:0 0 auto;min-width:150px}
            .searchbar-wrap{overflow:hidden}
            .searchbar-inner{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden}
            .main{overflow-x:hidden}
            .table-wrap{max-width:100%}
          }
          '''
          css.write_text(text)
          Path('.github/workflows/fix-mobile-overflow.yml').unlink(missing_ok=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile navigation overflow"
          git push
